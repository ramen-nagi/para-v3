<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2196f3" />
    <title>Para live location</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQ3ynh4RkMZrPZKto5o9Rac7CqjQ4o="
      crossorigin=""
    />
    <style>
      :root { font-family: Arial, sans-serif; color: #1f2937; background: #dce8f4; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button { font: inherit; }
      .page { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
      #map { position: absolute; inset: 0; background: #dce8f4; }
      .topbar {
        position: absolute; z-index: 500; top: 16px; left: 16px; right: 16px;
        display: flex; align-items: center; justify-content: space-between;
        pointer-events: none;
      }
      .logo {
        width: 48px; height: 48px; border-radius: 13px;
        box-shadow: 0 4px 12px rgba(31, 41, 55, 0.2);
      }
      .status {
        display: flex; align-items: center; gap: 8px; min-height: 42px;
        padding: 0 14px; border-radius: 14px; background: #1976d2;
        color: white; font-size: 13px; font-weight: 700;
        box-shadow: 0 4px 12px rgba(31, 41, 55, 0.18);
      }
      .status-dot {
        width: 9px; height: 9px; border-radius: 50%; background: #29d344;
        box-shadow: 0 0 0 4px rgba(41, 211, 68, 0.2);
      }
      .status.stale { background: #ed8b00; }
      .status.offline { background: #d84343; }
      .status.ended { background: #667085; }
      .status.stale .status-dot,
      .status.offline .status-dot,
      .status.ended .status-dot { background: white; box-shadow: none; }

      .card {
        position: absolute; z-index: 600; left: 16px; bottom: 16px;
        width: min(390px, calc(100vw - 32px)); padding: 20px;
        border-radius: 22px; background: white;
        box-shadow: 0 10px 30px rgba(31, 41, 55, 0.2);
      }
      .person {
        display: flex; align-items: center; gap: 12px; padding-bottom: 15px;
      }
      .avatar {
        display: grid; width: 46px; height: 46px; flex: 0 0 46px;
        place-items: center; border-radius: 50%; background: #1976d2;
        color: white; font-size: 20px; font-weight: 700;
      }
      h1 { margin: 0; font-size: 18px; line-height: 1.25; }
      .updated { margin: 4px 0 0; color: #7b8492; font-size: 13px; }
      .detail {
        display: grid; grid-template-columns: 38px 1fr; gap: 11px; padding: 13px 0;
        border-top: 1px solid #e5e7eb;
      }
      .icon {
        display: grid; width: 36px; height: 36px; place-items: center;
        border-radius: 11px; background: #e8f2ff; color: #1976d2;
        font-size: 19px; font-weight: 700;
      }
      .icon.destination { background: #ffebee; color: #d32f2f; }
      .label { display: block; color: #7b8492; font-size: 12px; }
      .value { display: block; margin-top: 3px; font-size: 15px; font-weight: 700; }
      .subvalue { display: block; margin-top: 3px; color: #667085; font-size: 13px; }
      .message {
        display: none; margin: 0 0 14px; padding: 10px 12px;
        border-radius: 10px; background: #fff3e0; color: #854d0e; font-size: 13px;
      }
      .message.visible { display: block; }
      .actions { display: flex; gap: 10px; margin-top: 6px; }
      .action {
        flex: 1; min-width: 0; min-height: 44px; border: 1px solid #1976d2;
        border-radius: 14px; background: white; color: #1976d2;
        font-weight: 700; cursor: pointer;
      }
      .action:disabled { opacity: 0.45; cursor: default; }
      .live-marker {
        width: 20px; height: 20px; border: 4px solid white;
        border-radius: 50%; background: #1976d2;
        box-shadow: 0 0 0 8px rgba(25, 118, 210, 0.22);
      }
      .destination-marker {
        display: grid; width: 28px; height: 28px; place-items: center;
        border: 3px solid white; border-radius: 50% 50% 50% 0;
        background: #d32f2f; color: white;
        transform: rotate(-45deg);
      }
      .destination-marker span { transform: rotate(45deg); }
      @media (min-width: 700px) {
        .topbar { top: 22px; left: 22px; right: 22px; }
        .card { left: 22px; bottom: 22px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div id="map" aria-label="Shared live location map"></div>
      <header class="topbar">
        <img class="logo" src="para-logo.png" alt="Para" />
        <div class="status ended" data-status>
          <span class="status-dot"></span>
          <span data-status-text>CONNECTING</span>
        </div>
      </header>

      <section class="card" aria-live="polite">
        <p class="message" data-message></p>
        <div class="person">
          <div class="avatar">P</div>
          <div>
            <h1>The user is sharing live location</h1>
            <p class="updated" data-updated>Waiting for an update...</p>
          </div>
        </div>

        <div class="detail">
          <div class="icon destination">&#9679;</div>
          <div>
            <span class="label">Destination</span>
            <span class="value" data-destination>Not shared</span>
          </div>
        </div>

        <div class="detail">
          <div class="icon">&#8594;</div>
          <div>
            <span class="label">Current journey</span>
            <span class="value" data-route>Waiting for route information</span>
            <span class="subvalue" data-leg></span>
          </div>
        </div>

        <div class="actions">
          <button class="action" type="button" data-recenter disabled>Recenter</button>
          <button class="action" type="button" data-copy>Copy link</button>
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const get = (name) => document.querySelector(`[data-${name}]`);
      const elements = {
        status: get('status'), statusText: get('status-text'), message: get('message'),
        updated: get('updated'),
        destination: get('destination'), route: get('route'), leg: get('leg'),
        recenter: get('recenter'), copy: get('copy'),
      };
      const token = new URLSearchParams(location.search).get('token');
      const map = L.map('map', { zoomControl: false }).setView([14.5995, 120.9842], 12);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      let liveMarker;
      let destinationMarker;
      let latestPosition;
      let latestUpdate;
      const liveIcon = L.divIcon({
        className: '', html: '<div class="live-marker"></div>',
        iconSize: [20, 20], iconAnchor: [10, 10],
      });
      const destinationIcon = L.divIcon({
        className: '', html: '<div class="destination-marker"><span>&#9679;</span></div>',
        iconSize: [28, 28], iconAnchor: [14, 25],
      });

      function setStatus(text, type) {
        elements.statusText.textContent = text;
        elements.status.className = `status ${type}`;
      }

      function showMessage(text = '') {
        elements.message.textContent = text;
        elements.message.classList.toggle('visible', Boolean(text));
      }

      function timeAgo(value) {
        if (!value) return 'Waiting for an update...';
        const seconds = Math.max(0, Math.floor((Date.now() - new Date(value)) / 1000));
        if (seconds < 10) return 'Updated just now';
        if (seconds < 60) return `Updated ${seconds} seconds ago`;
        const minutes = Math.floor(seconds / 60);
        return `Updated ${minutes} minute${minutes === 1 ? '' : 's'} ago`;
      }

      function modeName(mode) {
        return ({ walk: 'Walking', jeep: 'Jeepney', bus: 'Bus', train: 'Train',
          tricycle: 'Tricycle', uvExpress: 'UV Express' })[mode] || 'Transit';
      }

      function render(row) {
        if (!row) {
          setStatus('SHARING ENDED', 'ended');
          showMessage('This link has expired or location sharing has stopped.');
          elements.recenter.disabled = true;
          return;
        }

        const position = [Number(row.lat), Number(row.lng)];
        if (!position.every(Number.isFinite)) return;
        latestPosition = position;
        latestUpdate = row.updated_at;
        const stale = Date.now() - new Date(row.updated_at).getTime() > 30000;
        setStatus(stale ? 'STALE' : 'LIVE SHARING', stale ? 'stale' : 'live');
        showMessage(stale ? 'The last position may be outdated.' : '');

        elements.updated.textContent = timeAgo(row.updated_at);
        elements.destination.textContent = row.destination_name || 'Not shared';
        elements.route.textContent = `${modeName(row.transport_mode)} \u00b7 ${row.route_name || 'Transit'}`;
        elements.leg.textContent = row.leg_number && row.leg_count
          ? `Part ${row.leg_number} of ${row.leg_count} \u00b7 ${row.leg_from} \u2192 ${row.leg_to}`
          : `${row.leg_from || ''} \u2192 ${row.leg_to || ''}`;

        if (!liveMarker) {
          liveMarker = L.marker(position, { icon: liveIcon }).addTo(map);
          map.setView(position, 16);
        } else {
          liveMarker.setLatLng(position);
        }

        const destination = [Number(row.destination_lat), Number(row.destination_lng)];
        if (destination.every(Number.isFinite)) {
          if (!destinationMarker) {
            destinationMarker = L.marker(destination, { icon: destinationIcon }).addTo(map);
          } else {
            destinationMarker.setLatLng(destination);
          }
        }
        elements.recenter.disabled = false;
      }

      async function refresh() {
        if (!token) return render(null);
        try {
          const response = await fetch(`/api/location?token=${encodeURIComponent(token)}`, {
            cache: 'no-store',
          });
          if (!response.ok) throw new Error();
          render(await response.json());
        } catch (_) {
          setStatus('OFFLINE', 'offline');
          showMessage('The tracker could not refresh. Check your connection.');
        }
      }

      elements.recenter.addEventListener('click', () => {
        if (latestPosition) map.setView(latestPosition, Math.max(map.getZoom(), 16));
      });

      elements.copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          elements.copy.textContent = 'Copied!';
        } catch (_) {
          elements.copy.textContent = 'Copy failed';
        }
        setTimeout(() => { elements.copy.textContent = 'Copy link'; }, 1400);
      });

      setInterval(() => {
        if (latestUpdate) elements.updated.textContent = timeAgo(latestUpdate);
      }, 1000);
      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
